---
name: Python application

on:  # yamllint disable-line rule:truthy
  push:
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
      - tox.ini
      - .github/workflows/main.yml
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
      - tox.ini
      - .github/workflows/main.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 'Install uv and set up Python ${{ matrix.python-version }}'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '${{ matrix.python-version }}'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run ruff check . --select=E9,F63,F7,F82 --output-format=full
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run ruff check . --exit-zero
      - name: Test with pytest
        run: uv run pytest
      - name: Searchs for know vulnerabities
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .
